name: Ritaglio Automatico Foto

on:
  push:
    paths:
      - 'foto_input/**'
  workflow_dispatch:

jobs:
  crop-photos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Scarica repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Elabora Immagini
      run: python main.py

    - name: Salva i risultati
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Ritaglio automatico eseguito"
        file_pattern: "foto_output/*"
